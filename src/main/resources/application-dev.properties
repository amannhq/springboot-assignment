# ============================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================
# Secrets can be overridden via environment variables

# Server Configuration
server.port=${SERVER_PORT:8081}

# MongoDB (reads from env var or uses local default)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/rideshare}
spring.data.mongodb.database=${MONGODB_DATABASE:rideshare}

# JWT Configuration (reads from env var or uses dev default)
jwt.secret=${JWT_SECRET:DevOnlySecretKeyForLocalTestingPurposesOnlyDoNotUseInProd123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# GZIP Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Logging (verbose for development)
logging.level.org.springframework.security=DEBUG
logging.level.org.example.rideshare=DEBUG
logging.level.org.mongodb.driver=INFO

# Jackson JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
