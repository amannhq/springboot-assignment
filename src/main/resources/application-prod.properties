# ============================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ============================================
# Secrets are loaded from ENVIRONMENT VARIABLES
# NEVER commit actual secrets to this file!

# Server Configuration
server.port=${SERVER_PORT:8080}

# ============================================
# PERFORMANCE OPTIMIZATIONS
# ============================================

# Enable GZIP Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Tomcat Thread Pool Optimization
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# Connection Keep-Alive
server.tomcat.keep-alive-timeout=30000
server.tomcat.connection-timeout=20000

# ============================================
# MongoDB Configuration (FROM ENVIRONMENT VARIABLES)
# ============================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:rideshare}

# ============================================
# JWT Configuration (FROM ENVIRONMENT VARIABLES)
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Jackson JSON Optimization
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================
# Logging - JSON Structured (see logback-spring.xml)
# ============================================
# Log file location (defaults to logs/ in current directory, override with LOG_PATH env var)
logging.file.path=${LOG_PATH:logs}
